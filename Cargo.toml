[package]
name = "lifting-pose"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "OpenCV + RTMW-m body, hand and foot pose estimation"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
opencv = { version = "0.101.1", default-features = false, features = ["clang-runtime", "dnn", "highgui", "imgcodecs", "imgproc", "videoio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
