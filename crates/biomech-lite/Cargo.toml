[package]
name = "biomech-lite"
version = "0.1.0"
edition = "2024"
description = "Standalone Rust subset of MuJoCo 3.17 kinematics, tendon wrapping and muscle mechanics for the MyoSim full-body reference model (prescribed replay + fixed-torso arm dynamics). No FFI, no Python at runtime."
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
