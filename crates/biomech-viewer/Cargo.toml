[package]
name = "biomech-viewer"
version = "0.1.0"
edition = "2024"
description = "Native software-rendered 3D viewer for the biomech-lite MyoSim reference model: recorded replay and live arm dynamics. No Python, MuJoCo or browser at runtime."
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "biomech-viewer"
path = "src/main.rs"

[dependencies]
biomech-lite = { path = "../biomech-lite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
minifb = "0.29"
font8x8 = "0.3"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
